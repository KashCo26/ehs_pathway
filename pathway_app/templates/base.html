{% load tailwind_tags %}
<html lang="en" data-theme="pathway-emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathWay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% tailwind_css %}
</head>

<body class="bg-base-100 text-base-content min-h-screen flex">

    <!-- Dark Navy Sidebar from Image -->
    <nav class="w-64 h-screen sticky top-0 bg-neutral text-neutral-content p-6 flex flex-col justify-between border-r border-neutral-content/10">
        
        <div class="space-y-8">
            <a href="{% url 'home' %}" class="block text-2xl font-serif font-bold tracking-tight">
                Path<span class="text-primary">way</span>
            </a>

            <div class="space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-neutral-content/70 hover:bg-neutral-content/10 transition">
                    <span class="w-2 h-2 rounded-full bg-neutral-content/40"></span>
                    Course catalog
                </a>

                <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-semibold bg-neutral-content/15 text-neutral-content transition">
                    <span class="w-2 h-2 rounded-full bg-neutral-content"></span>
                    4-year plan
                </a>

                <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-neutral-content/70 hover:bg-neutral-content/10 transition">
                    <span class="w-2 h-2 rounded-full bg-neutral-content/40"></span>
                    Credits
                </a>

                <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-neutral-content/70 hover:bg-neutral-content/10 transition">
                    <span class="w-2 h-2 rounded-full bg-neutral-content/40"></span>
                    Pathway explorer
                </a>
            </div>
        </div>

        <div class="pt-4 border-t border-neutral-content/10 text-xs text-neutral-content/50">
            Class of 2029 · Junior year
        </div>

    </nav>

    <main class="flex-1 p-8 bg-base-100 text-base-content">
        {% block content %}
        {% endblock content %}
    </main>

</body>
</html>
