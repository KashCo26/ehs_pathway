{% load tailwind_tags %}
<html lang="en" data-theme="silk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxTrot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% tailwind_css %}
</head>

<body class="bg-base-200 text-base-content min-h-screen pb-20 relative">
    <header class="sticky top-0 z-40 w-full bg-base-100/95 bg-base-100 border-b border-base-300 h-16 flex items-center justify-between px-8">
        <div class="flex items-center space-x-8">
            <a class="flex items-center space-x-2 text-xl tracking-tight" href="{% url 'home' %}">
                <div class="bg-primary/10 text-base-content/60 w-10 h-10 rounded-xl flex items-center justify-center text-2xl shadow-inner">
                    
                </div>
                <span class="flex space-x-2 font-bold text-lg tracking-tight">PathWay</span>
            </a>
        </div>
    </header>

    <main class="p-8">
        {% block content %}
        {% endblock content %}
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 h-16 bg-base-100 border-t border-base-300 flex justify-around items-center px-5">
        <a href="#" class="flex flex-col items-center justify-center text-base-content/60 gap-1">
        </a>

        <a href="#" class="flex flex-col items-center justify-center text-base-content/60 gap-1">
            <i class="fas fa-folder text-xl"></i>
            <span class="text-[10px] font-bold tracking-wider uppercase">Folders</span>
        </a>
        
        <a href="#" class="flex flex-col items-center justify-center text-base-content/60 gap-1">
            <i class="fas fa-book text-xl"></i>
            <span class="text-[10px] font-bold tracking-wider uppercase">Lessons</span>
        </a>
        
        <a href="#" class="flex flex-col items-center justify-center text-base-content/60 gap-1">
            <i class="fas fa-pen-to-square text-xl"></i>
            <span class="text-[10px] font-bold tracking-wider uppercase">Quizzes</span>
        </a>

        <a href="#" class="flex flex-col items-center justify-center text-base-content/60 gap-1">
            <i class="fas fa-trophy text-xl"></i>
            <span class="text-[10px] font-bold tracking-wider uppercase">Rank</span>
        </a>
    </nav>

</body>
</html>
